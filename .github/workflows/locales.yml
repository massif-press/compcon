name: Locales sync

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: locales-sync
  cancel-in-progress: false

env:
  LOCALES_BRANCH: automated/locales-sync

jobs:
  sync:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Bundle standalone build-lcp.mjs
        run: |
          npx --yes esbuild@0.25.12 scripts/build-llp.mjs \
            --bundle --platform=node --format=esm \
            --external:jszip --legal-comments=none \
            --banner:js="$(sed -n '/^\/\*!/,/^\*\//p' scripts/build-llp.mjs)" \
            --outfile=build-lcp.mjs
          node build-lcp.mjs 2>&1 | grep -q '^usage: build-lcp.mjs'

      - name: Sync base catalogs to compcon-locales (PR)
        env:
          GH_TOKEN: ${{ secrets.LOCALES_PR_TOKEN }}
        run: |
          gh auth setup-git
          gh repo clone massif-press/compcon-locales locales-repo
          cp src/i18n/locales/en.json locales-repo/ui/en.json
          mkdir -p locales-repo/content/lancer-data locales-repo/content/lancer-srd
          cp content/en/lancer-data.json locales-repo/content/lancer-data/en.json
          cp content/en/lancer-srd.json locales-repo/content/lancer-srd/en.json
          cp build-lcp.mjs locales-repo/build-lcp.mjs

          cd locales-repo
          git config user.name 'compcon-bot'
          git config user.email 'bot@compcon.app'
          git add -f ui/en.json content/lancer-data/en.json content/lancer-srd/en.json build-lcp.mjs
          if git diff --cached --quiet; then
            echo 'base catalogs and build-lcp.mjs already up to date; nothing to sync.'
            exit 0
          fi
          git checkout -B "$LOCALES_BRANCH"
          git commit -m "chore: sync base catalogs + build-lcp.mjs from compcon@${GITHUB_SHA}"
          git push -f origin "$LOCALES_BRANCH"
          if [ -z "$(gh pr list --head "$LOCALES_BRANCH" --state open --json number -q '.[].number')" ]; then
            gh pr create \
              --base master \
              --head "$LOCALES_BRANCH" \
              --title 'chore: sync base catalogs + build-lcp.mjs from compcon' \
              --body 'Automated sync from massif-press/compcon dev.

          - English bases (UI + content): read-only in Weblate; merging refreshes the source strings translators work from.
          - `build-lcp.mjs`: standalone bundle of `scripts/build-llp.mjs` with the content-key rules inlined, so third-party LCP authors can generate `.llp` patches without cloning compcon. Needs Node 18+; `bundle` mode additionally needs `npm i jszip`.'
          fi
